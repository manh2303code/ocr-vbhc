<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="sketch-size" content="1600x1190">
<title>OCR VBHC — Kiến trúc tổng thể</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sketch.css">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6" crossorigin="anonymous"></script>
<script src="sketch.js"></script>
</head>
<body>
<div id="board"></div>
<script>
Sketch.draw({
  width: 1600, height: 1190,
  title: "Kiến trúc OCR VBHC",
  subtitle: "Mọi thành phần chạy trên một máy trạm — không có kết nối nào ra Internet.",
}, (s) => {
  // ── Ranh giới air-gap: cả máy trạm ────────────────────────────────────
  s.frame(50, 195, 1500, 920, {
    label: "Máy trạm cơ quan — không Internet", tone: "red", washOpacity: 0.14,
  });

  s.note(1100, 30, [
    "Chỉ 127.0.0.1 — hai llama-server chạy --host 127.0.0.1;",
    "main.py đặt HF_HUB_OFFLINE=1; landing chặn mọi URL",
    "không phải file/qrc/data. tools/check_airgap.py soát",
    "kết nối TCP thật, tests/test_airgap.py canh giữ.",
  ].join("\n"), { width: 430, size: 17, rotate: 1.2 });

  // ── Tầng 1: vỏ ứng dụng & khởi động ───────────────────────────────────
  s.frame(80, 245, 1100, 144, { label: "Vỏ ứng dụng · khởi động", tone: "olive" });
  const boot = s.box(100, 261, 290, 112, {
    label: "Khởi động", tone: "olive",
    sub: "main.py\nstartup_controller.AppController",
  });
  const landing = s.box(430, 261, 400, 112, {
    label: "Màn hình chào", tone: "olive",
    sub: "landing_page.LandingWindow\nQWebEngine (frontend/landing) · fallback Qt",
  });
  const snap = s.box(870, 261, 290, 112, {
    label: "Số liệu đọc-chỉ", tone: "olive",
    sub: "landing_data · SQLite mode=ro\nđọc trước khi nạp mô hình",
  });
  s.arrow(boot.right, landing.left);
  s.arrow(snap.left, landing.right);

  // ── Tầng 2: không gian làm việc ───────────────────────────────────────
  s.frame(80, 439, 1100, 144, { label: "Không gian làm việc", tone: "olive" });
  const win = s.box(100, 455, 290, 112, {
    label: "Cửa sổ chính", tone: "olive",
    sub: "main_window_1.MainWindow\nghép panel, lệnh, worker",
  });
  s.box(430, 455, 400, 112, {
    label: "Panel & hộp thoại", tone: "olive",
    sub: "chat_panel · doc_list_widget · ai_search_dialog\nanalytics_dialog · settings_dialog",
  });
  s.box(870, 455, 290, 112, {
    label: "Lệnh & bố cục", tone: "olive",
    sub: "ui_commands: danh mục lệnh duy nhất\nworkspace_layout",
  });
  s.arrow(boot.at(0.83, 1), win.at(0.83, 0), {
    label: "import trễ khi chọn tác vụ", labelDx: 112,
  });

  // ── Hệ thống thiết kế (khối bên cạnh) ─────────────────────────────────
  s.box(1230, 245, 290, 150, {
    label: "Hệ thống thiết kế", tone: "olive", dashed: true, subSize: 16,
    sub: "theme_tokens: COLORS · DARK_COLORS\ntheme_manager_v2 (sáng/tối)\nui_icons + Lucide SVG\nfont_loader + Be Vietnam Pro",
  });

  s.note(1232, 428, [
    "tests/test_architecture_boundaries.py",
    "khóa MainWindow khỏi phình lại:",
    "worker, DocumentOCR, DocumentDatabase",
    "phải ở module riêng; cấm trùng",
    "method; chỉ dùng ThemeManager v2.",
  ].join("\n"), { width: 288, size: 16, rotate: 1.5 });

  // ── Tầng 3: xử lý & AI ────────────────────────────────────────────────
  s.frame(80, 633, 1100, 274, { label: "Xử lý & AI", tone: "gold" });
  const workers = s.box(100, 651, 1060, 84, {
    label: "Worker nền — background_workers", tone: "gold",
    sub: "OCRWorker · BatchProcessWorker · EmbeddingWorker · RelationWorker · ReindexWorker · AgentWorker · FileRepairWorker",
  });
  s.arrow(win.at(0.83, 1), [win.at(0.83, 1)[0], workers.y], {
    label: "giao việc nặng cho QThread", labelDx: 118,
  });

  const ocr = s.box(100, 753, 240, 136, {
    label: "OCR văn bản", tone: "gold",
    sub: "ocr_pipeline\nllama_ocr\nchandra_field_parser",
  });
  const search = s.box(370, 753, 270, 136, {
    label: "Tìm kiếm lai", tone: "gold",
    sub: "ai_search · retrieval\nsearch_store (BM25)\nvector_index · reranker",
  });
  const agent = s.box(670, 753, 240, 136, {
    label: "Trợ lý hỏi đáp", tone: "gold",
    sub: "rag_agent · agent_tools\nllm_client\nchat_history",
  });
  const graph = s.box(940, 753, 220, 136, {
    label: "Đồ thị pháp lý", tone: "gold",
    sub: "legal_relations\n(quy tắc regex)\nlegal_graph",
  });

  // ── Tầng 4: dữ liệu ───────────────────────────────────────────────────
  s.frame(1230, 633, 290, 460, { label: "Dữ liệu", tone: "blue" });
  const repo = s.box(1250, 653, 250, 104, {
    label: "Kho văn bản", tone: "blue",
    sub: "document_repository\n.DocumentDatabase",
  });
  const db = s.cylinder(1260, 800, 230, 270, {
    label: "documents.db", tone: "blue",
    sub: "database/ · SQLite WAL\nFTS5 BM25 · sqlite-vec\n(NumPy dự phòng)",
  });
  s.arrow(repo.bottom, db.top);
  // Giao diện ghi/đọc văn bản qua repository: đi theo hành lang giữa hai cột.
  s.line([[1180, 511], [1205, 511], [1205, 705]], { tone: "blue" });
  s.arrow([1205, 705], repo.left, { tone: "blue" });
  s.arrow(graph.at(1, 0.85), [db.x, graph.at(1, 0.85)[1]], {
    tone: "blue", label: "SQL", labelDy: -16,
  });

  // ── Tầng 5: mô hình cục bộ ────────────────────────────────────────────
  s.frame(80, 957, 1100, 136, { tone: "red" });
  s.text(1158, 945, "Mô hình cục bộ", {
    size: 22, font: "title", color: s.tones.red.ink, anchor: "end",
  });
  const chandra = s.box(100, 973, 290, 104, {
    label: "llama-server :9999", tone: "red", labelSize: 21,
    sub: "Chandra OCR 2 (Q4)\nllama_server_manager",
  });
  const embed = s.box(415, 973, 340, 104, {
    label: "Nhúng & xếp hạng", tone: "red", labelSize: 21,
    sub: "model_embedding/ · model_reranker/\nsentence-transformers, trong tiến trình",
  });
  const qwen = s.box(780, 973, 320, 104, {
    label: "llama-server :9998", tone: "red", labelSize: 21,
    sub: "Qwen3 4B / 8B theo VRAM\nchat_server_manager · bật khi mở chat",
  });

  s.arrow(ocr.bottom, [ocr.cx, chandra.y], { tone: "red", label: "HTTP 127.0.0.1" });
  s.arrow(search.bottom, embed.at(0.5, 0), { tone: "red" });
  s.arrow(agent.bottom, qwen.at(0.4, 0), { tone: "red", label: "HTTP 127.0.0.1" });
});
</script>
</body>
</html>
