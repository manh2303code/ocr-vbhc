<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="sketch-size" content="1600x1120">
<title>OCR VBHC — Một tệp SQLite, ba cách tìm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sketch.css">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6" crossorigin="anonymous"></script>
<script src="sketch.js"></script>
</head>
<body>
<div id="board"></div>
<script>
Sketch.draw({
  width: 1600, height: 1120,
  title: "Một tệp SQLite, ba cách tìm",
  subtitle: "database/documents.db chứa tất cả: tìm theo từ khóa (FTS5), theo nghĩa (sqlite-vec) và theo quan hệ pháp lý (đồ thị).",
}, (s) => {
  const INK = "#17231B";
  let seed = 41;

  // An entity box: table name, a hand-drawn rule, then one column per row
  // with its key role (PK / FK / FK*) written against the right edge.
  function table(x, y, w, name, rows, opts) {
    opts = opts || {};
    const toneName = opts.tone || "blue";
    const t = s.tones[toneName];
    const h = 56 + rows.length * 22;
    const a = s.box(x, y, w, h, { tone: toneName, dashed: opts.dashed, radius: 10 });
    s.text(x + 16, y + 30, name, { size: opts.titleSize || 20, font: "title", color: t.ink });
    s.layer("text").appendChild(s.rc.line(x + 10, y + 42, x + w - 10, y + 42, {
      stroke: t.stroke, strokeWidth: 1.2, roughness: 0.8, seed: seed++,
    }));
    rows.forEach(([col, tag], i) => {
      const baseline = y + 42 + 22 * (i + 1) - 2;
      s.text(x + 16, baseline, col, { size: 16, color: INK });
      if (tag) s.text(x + w - 14, baseline, tag, { size: 14, font: "title", color: t.ink, anchor: "end" });
    });
    return a;
  }

  // ── Văn bản & phiên bản ─────────────────────────────────────────────────
  s.frame(580, 205, 340, 435, { label: "Văn bản & phiên bản", tone: "blue" });
  const versions = table(600, 235, 300, "document_versions", [
    ["id", "PK"],
    ["document_id", "FK"],
    ["version_number, model_used", ""],
    ["so_ki_hieu, loai_vb, ngay_bh…", ""],
    ["van_ban_dang_txt (toàn văn)", ""],
  ]);
  const docs = table(620, 470, 260, "documents", [
    ["id", "PK"],
    ["file_path, file_name", ""],
    ["file_hash, file_size", ""],
    ["page_count", ""],
  ], { titleSize: 22 });
  s.arrow([750, 403], [750, 468], { label: "document_id", labelSize: 15, tone: "blue" });

  // ── Chỉ mục tìm kiếm ────────────────────────────────────────────────────
  s.frame(990, 205, 560, 420, { label: "Chỉ mục tìm kiếm", tone: "gold" });
  const fts = table(1015, 230, 255, "chunks_fts · FTS5", [
    ["rowid = document_chunks.id", ""],
    ["chunk_text · xếp hạng BM25", ""],
    ["unicode61, giữ dấu thanh", ""],
  ], { dashed: true });
  const vec = table(1290, 230, 240, "chunk_vectors · vec0", [
    ["rowid = document_chunks.id", ""],
    ["embedding float[1024]", ""],
    ["khoảng cách cosine", ""],
  ], { dashed: true });
  const chunks = table(1015, 405, 290, "document_chunks", [
    ["id", "PK"],
    ["document_id", "FK"],
    ["chunk_index, page_number", ""],
    ["chunk_text", ""],
    ["embedding (BLOB)", ""],
  ]);
  const legacy = table(1325, 410, 205, "document_embeddings", [
    ["document_id", "PK, FK"],
    ["embedding (BLOB)", ""],
    ["cũ: 1 vector/văn bản", ""],
  ], { tone: "muted", titleSize: 18 });

  s.arrow([1140, 354], [1140, 403], { label: "3 trigger đồng bộ", labelSize: 15, tone: "gold" });
  s.arrow([1405, 354], [1285, 403], { label: "rowid = id", labelSize: 15, tone: "gold" });
  s.arrow([1013, 500], [882, 500], { label: "document_id", labelSize: 15, tone: "blue" });
  s.elbow([1427, 534], [882, 598], { verticalFirst: true, label: "document_id", labelSize: 15, tone: "muted" });

  // ── Phụ trợ (thu gọn) ───────────────────────────────────────────────────
  s.frame(60, 205, 380, 200, { label: "Phụ trợ", tone: "muted" });
  table(85, 235, 330, "4 bảng nhỏ", [
    ["page_detections · nhận dạng/trang", "FK"],
    ["document_tags · nhãn", "FK"],
    ["document_backups · bản sao", "FK"],
    ["field_suggestions · gợi ý nhập", ""],
  ], { tone: "muted" });
  s.arrow([417, 330], [618, 520], { label: "document_id", labelSize: 15, tone: "muted" });

  // ── Hội thoại ───────────────────────────────────────────────────────────
  s.frame(60, 470, 380, 370, { label: "Hội thoại", tone: "olive" });
  table(100, 500, 300, "chat_sessions", [
    ["id", "PK"],
    ["title, created_at", ""],
  ]);
  table(100, 670, 300, "chat_messages", [
    ["id", "PK"],
    ["session_id", "FK"],
    ["role, content", ""],
    ["citations_json", ""],
  ]);
  s.arrow([250, 668], [250, 602], { label: "session_id · ON DELETE CASCADE", labelSize: 15, tone: "olive" });
  s.arrow([402, 722], [618, 592], { label: "citations_json", labelSize: 15, dashed: true });

  // ── Đồ thị pháp lý ──────────────────────────────────────────────────────
  s.frame(470, 720, 780, 240, { label: "Đồ thị pháp lý", tone: "paper" });
  table(495, 745, 260, "doc_relations", [
    ["id", "PK"],
    ["source_doc_id", "FK*"],
    ["target_doc_id (NULL được)", "FK*"],
    ["target_so_ki_hieu", ""],
    ["relation_type (4 loại)", ""],
  ]);
  table(785, 745, 215, "doc_entities", [
    ["doc_id", "FK*"],
    ["entity_type", ""],
    ["value_norm, value_raw", ""],
  ]);
  table(1025, 745, 205, "doc_validity", [
    ["doc_id", "PK, FK*"],
    ["status", ""],
    ["reason_doc_id", "FK*"],
    ["computed_at", ""],
  ]);
  s.text(785, 912, "FK* = chỉ tham chiếu theo id, không khai FOREIGN KEY:", { size: 15, color: "#5C665F" });
  s.text(785, 934, "văn bản đích có thể chưa có trong kho.", { size: 15, color: "#5C665F" });
  s.arrow([690, 743], [700, 616], { label: "source / target_doc_id", labelSize: 15, labelDy: -8, dashed: true });
  s.arrow([890, 743], [790, 616], { label: "doc_id", labelSize: 15, dashed: true });
  s.arrow([1125, 743], [860, 616], { label: "doc_id, reason_doc_id", labelSize: 15, dashed: true });

  // ── Chú giải ────────────────────────────────────────────────────────────
  s.text(470, 1000, "FK = khóa ngoại khai báo   ·   mũi tên nét đứt = tham chiếu không ràng buộc   ·   khung nét đứt = bảng ảo", { size: 16, color: "#5C665F" });

  // ── Ghi chú ─────────────────────────────────────────────────────────────
  s.note(60, 885, "Mỗi luồng một kết nối riêng (DBConnectionPool,\ntối đa 10) · PRAGMA journal_mode = WAL,\nsynchronous = NORMAL, busy_timeout = 30 s\n→ OCR ghi nền trong khi giao diện vẫn đọc.", {
    width: 380, size: 16, rotate: -1.2,
  });
  s.note(1290, 700, "Vì sao không đặt DB trên ổ\nmạng? WAL cần bộ nhớ chia sẻ\n(-shm) và khóa tệp trên cùng\nmột máy; NFS/SMB không bảo\nđảm điều đó → WAL không tin\ncậy. Mỗi máy một documents.db,\nchuyển dữ liệu bằng bản sao\nlưu (backup_database).", {
    width: 255, size: 16, rotate: 1.8,
  });
});
</script>
</body>
</html>
