<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="sketch-size" content="1600x1100">
<title>OCR VBHC — Trợ lý pháp luật trả lời kèm nguồn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sketch.css">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6" crossorigin="anonymous"></script>
<script src="sketch.js"></script>
</head>
<body>
<div id="board"></div>
<script>
Sketch.draw({
  width: 1600, height: 1100,
  title: "Trợ lý pháp luật trả lời kèm nguồn",
  subtitle: "Vòng lặp agent tự viết trên Qwen3 cục bộ — chỉ những nguồn được trích dẫn thật mới đi kèm câu trả lời.",
}, (s) => {
  // ── Hàng 1: người dùng → dock → RagAgent ⇄ Qwen3 ───────────────────────
  s.actor(95, 215, { label: "Người dùng", tone: "olive" });
  const dock = s.box(170, 190, 230, 130, {
    label: "Trợ lý pháp luật", sub: "dock · chat_panel.py\ngửi ≤ 12 tin gần nhất\n(≤ 12 000 ký tự)",
    tone: "olive", badge: 1, labelSize: 22, subSize: 16,
  });
  const agent = s.box(600, 190, 300, 130, {
    label: "RagAgent.ask", sub: "rag_agent.py\nchạy trong AgentWorker (QThread)",
    tone: "gold", subSize: 16,
  });
  const llm = s.box(1080, 180, 460, 150, {
    label: "Qwen3 · llama-server :9998",
    sub: "VRAM ≥ 10 000 MB → 8B (GPU)\nVRAM ≥ 5 000 MB → 4B (GPU) · còn lại 4B (CPU)\nbật khi hỏi lần đầu · tắt thinking",
    tone: "red", badge: 3, subSize: 16,
  });

  s.arrow([130, 250], [168, 250], { tone: "olive" });
  s.arrow([402, 255], [598, 255], { label: "câu hỏi + lịch sử", labelSize: 16 });
  s.arrow([902, 226], [1078, 226], { label: "messages + 5 tools", labelSize: 16, tone: "red" });
  s.arrow([1078, 292], [902, 292], { label: "tool_calls / trả lời", labelSize: 16, tone: "red" });

  // ── Hàng 2: nạp nguồn trước · câu trả lời · vòng lặp công cụ ───────────
  const prefetch = s.box(540, 440, 300, 130, {
    label: "prefetch_documents", sub: "nạp nguồn trước vòng lặp\n≤ 6 đoạn, ≤ 3 đoạn / văn bản",
    tone: "gold", badge: 2, labelSize: 22, subSize: 16,
  });
  s.arrow([690, 322], [690, 438], { both: true, tone: "gold" });

  const answer = s.box(60, 440, 360, 150, {
    label: "Câu trả lời có trích dẫn",
    sub: "bỏ <think>…</think>, không lưu\nchỉ giữ nguồn được trích [n]\nbấm [n] → mở đúng văn bản, đúng trang",
    tone: "olive", badge: 6, labelSize: 22, subSize: 16,
  });
  s.arrow([610, 322], [404, 436], { label: "AgentResult", labelSize: 16, tone: "olive" });
  s.arrow([240, 436], [240, 324], { label: "hiện trong dock", labelSize: 16, tone: "olive" });

  // Small two-line card: the kit centres a one-line sub low in short boxes,
  // so the label and sub are placed by hand around the box centre.
  const card = (x, y, w, h, label, sub, tone, opts) => {
    opts = opts || {};
    const a = s.box(x, y, w, h, { tone, shadow: opts.shadow, radius: 10 });
    s.text(a.cx, a.cy - 6, label, { size: opts.labelSize || 19, font: "title", anchor: "middle", color: s.tones[tone].ink });
    s.text(a.cx, a.cy + 19, sub, { size: opts.subSize || 15, anchor: "middle", color: "#5C665F" });
    return a;
  };

  const tools = s.frame(960, 440, 580, 290, { label: "Vòng lặp công cụ · ToolExecutor", tone: "gold" });
  s.badge(964, 444, 4, { tone: "gold" });
  const tool = (x, y, label, sub) => card(x, y, 255, 70, label, sub, "gold", { shadow: false });
  const search = tool(985, 470, "search_documents", "tìm kiếm lai · top 8");
  tool(985, 555, "read_document_section", "lai, trong 1 văn bản · top 5");
  tool(1265, 470, "get_document_info", "số ký hiệu → metadata");
  tool(1265, 555, "get_related_documents", "đọc doc_relations");
  tool(1265, 640, "check_validity", "đọc doc_validity");
  s.text(1112, 664, "≤ 4 vòng (CPU) · ≤ 8 vòng (GPU)", { size: 17, anchor: "middle", color: s.tones.gold.ink });
  s.text(1112, 690, "rồi buộc trả lời bằng dữ liệu đã có", { size: 16, anchor: "middle", color: "#5C665F" });
  s.arrow([880, 322], [958, 520], { both: true, label: "gọi ⇄ kết quả [n]", labelSize: 16, labelDx: -34, tone: "gold" });

  // ── Hàng 3: tìm kiếm lai ────────────────────────────────────────────────
  s.frame(470, 820, 740, 210, { label: "Tìm kiếm lai", tone: "blue" });
  s.badge(474, 824, 5, { tone: "blue" });
  const fts = card(495, 845, 240, 78, "FTS5 · BM25", "chunks_fts · top 50", "blue", { labelSize: 20 });
  const vec = card(495, 938, 240, 78, "sqlite-vec · cosine", "chunk_vectors · 1024 chiều · top 50", "blue", { labelSize: 20, subSize: 14 });
  const rrf = s.box(800, 880, 170, 100, {
    label: "Gộp RRF", sub: "k = 60\nΣ 1 / (k + hạng)", tone: "gold", labelSize: 21, subSize: 15,
  });
  const rerank = s.box(1010, 880, 180, 100, {
    label: "ViRanker", sub: "rerank 10 ứng viên\n(prefetch: 20)", tone: "gold", labelSize: 21, subSize: 15,
  });
  s.arrow(fts.right, [798, 912], { tone: "blue" });
  s.arrow(vec.right, [798, 950], { tone: "blue" });
  s.arrow(rrf.right, rerank.left, { tone: "gold" });

  s.arrow([690, 572], [690, 818], { both: true, tone: "gold" });
  s.arrow([1110, 732], [1110, 878], { both: true, label: "query ⇄ đoạn + số trang", labelSize: 16, labelDy: -24, tone: "gold" });

  // ── Lưu hội thoại ───────────────────────────────────────────────────────
  s.cylinder(60, 660, 360, 150, {
    label: "chat_sessions · chat_messages",
    sub: "documents.db · lưu hỏi, đáp, citations_json\nmở lại phiên gần nhất", tone: "blue",
  });
  s.badge(80, 690, 7, { tone: "blue" });
  s.arrow([240, 600], [240, 658], { label: "lưu", labelSize: 16, tone: "blue" });

  // ── Ghi chú ─────────────────────────────────────────────────────────────
  s.note(70, 880, "Chân dock luôn ghi: “Công cụ hỗ trợ\ntra cứu — không thay thế tư vấn\npháp lý.” Mỗi câu trả lời cũng tự\nkết thúc bằng cảnh báo này.", {
    width: 330, size: 17, rotate: -1.5,
  });
  s.note(1250, 790, "Vì sao không LangChain,\nkhông tiktoken? Air-gap: lúc chạy\nkhông có kết nối mạng nào.\nAgent là ~250 dòng Python tự\nviết, chỉ gọi 127.0.0.1:9998.\nPhụ thuộc pip mới duy nhất:\nsqlite-vec.", {
    width: 290, size: 17, rotate: 2,
  });
});
</script>
</body>
</html>
