<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="sketch-size" content="1600x1150">
<title>OCR VBHC — Luồng số hóa văn bản</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sketch.css">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6" crossorigin="anonymous"></script>
<script src="sketch.js"></script>
</head>
<body>
<div id="board"></div>
<script>
Sketch.draw({
  width: 1600, height: 1150,
  title: "Từ trang giấy tới kho tri thức",
  subtitle: "Một văn bản đi qua 8 bước — tất cả chạy trên máy, không cần mạng",
}, (s) => {
  let seed = 500;
  const next = () => ++seed;

  // Small rough rectangle with centred text, drawn on top of a box.
  function chip(x, y, w, h, label, tone) {
    const t = s.tones[tone || "gold"];
    s.layer("shapes").appendChild(s.rc.rectangle(x, y, w, h, {
      fill: "#FFFEFA", fillStyle: "solid", stroke: t.stroke, strokeWidth: 1.3,
      roughness: 0.9, seed: next(),
    }));
    s.text(x + w / 2, y + h / 2 + 1, label, {
      size: 17, color: t.ink, anchor: "middle", baseline: "middle",
    });
  }

  // ── legend (top right, beside the subtitle) ─────────────────────────────
  const legend = [
    ["olive", "người dùng"], ["gold", "xử lý / AI"],
    ["blue", "lưu trữ"], ["red", "llama-server"],
  ];
  let lx = 1010;
  for (const [tone, name] of legend) {
    const t = s.tones[tone];
    s.layer("shapes").appendChild(s.rc.rectangle(lx, 118, 24, 18, {
      fill: t.fill, fillStyle: "solid", stroke: t.stroke, strokeWidth: 1.5,
      roughness: 1, seed: next(),
    }));
    const node = s.text(lx + 32, 128, name, { size: 17, color: "#3A433D", baseline: "middle" });
    lx += 32 + node.getComputedTextLength() + 30;
  }

  // ── row A: input → images → OCR → fields ────────────────────────────────
  const b1 = s.box(60, 190, 270, 130, {
    label: "Đưa văn bản vào", tone: "olive", badge: 1,
    sub: "add_file · add_files\nadd_folder (cả thư mục)\nPDF · PNG · JPG · TIFF · BMP",
  });
  const b2 = s.box(410, 190, 290, 130, {
    label: "Trang → ảnh", tone: "gold", badge: 2,
    sub: "pdf2image + Poppler\n150 DPI · trang ngang 200 DPI\nảnh gốc: mở thẳng",
  });
  const b3 = s.box(780, 190, 320, 130, {
    label: "Chandra OCR 2", tone: "gold", badge: 3,
    sub: "LlamaOCR · ocr_pipeline\nstreaming HTML từng trang\n1–4 trang song song (theo VRAM)",
  });
  const b4 = s.box(1180, 190, 360, 430, {
    label: "Bóc 12 trường NĐ30", tone: "gold", badge: 4, align: "top",
    sub: "chandra_field_parser",
  });

  s.arrow(b1.right, b2.left, { tone: "olive" });
  s.arrow(b2.right, b3.left, { tone: "gold" });
  s.arrow(b3.right, [b4.x, b3.cy], { tone: "gold" });

  // The 12 fields, grouped by where on the page the parser finds them.
  const cap = { size: 16, color: "#5C665F" };
  const c1 = 1200, c2 = 1368, cw = 152, ch = 28;
  s.text(c1, 302, "đầu văn bản (trang 1)", cap);
  [["CQBH_tren", "CQBH_duoi"], ["So_Ki_Hieu", "Ngay_BH"],
   ["Loai_VB", "ND_Chinh"], ["Do_Khan", "Do_Mat"]].forEach(([a, b], i) => {
    chip(c1, 312 + i * 34, cw, ch, a);
    chip(c2, 312 + i * 34, cw, ch, b);
  });
  s.text(c1, 470, "khối ký (trang có “Nơi nhận”)", cap);
  chip(c1, 480, cw, ch, "Noi_Nhan");
  chip(c2, 480, cw, ch, "Chuc_Vu");
  chip(c1, 514, cw, ch, "Chu_Ky");
  s.text(c1, 566, "toàn văn HTML, nối mọi trang", cap);
  chip(c1, 576, cw * 2 + 16, ch, "Van_ban_dang_txt");

  // ── llama-server under the OCR step ─────────────────────────────────────
  const srv = s.box(790, 400, 300, 110, {
    label: "llama-server :9999", tone: "red",
    sub: "127.0.0.1 · chandra-ocr-2 Q4 GGUF\n/v1/chat/completions",
  });
  s.arrow([880, b3.y + b3.h], [880, srv.y], {
    tone: "gold", label: "ảnh JPEG base64", labelDx: -88,
  });
  s.arrow([1000, srv.y], [1000, b3.y + b3.h], {
    tone: "red", label: "token HTML (SSE)", labelDx: 92,
  });

  // ── notes in the middle band ────────────────────────────────────────────
  s.note(60, 384,
    "Nhập thư mục tiếp được sau\nkhi dừng: mỗi tệp được lưu\nngay khi OCR xong; lần sau\nadd_folder bỏ qua mọi\nfile_path đã có trong DB.",
    { width: 280, size: 17, rotate: -2 });
  s.note(380, 384,
    "Vì sao chỉ dùng Chandra?\nBản 02/2026: YOLO dò vùng →\nVintern đọc từng vùng.\nTừ 17/04/2026: một mô hình thị\ngiác đọc cả trang ra HTML (giữ\nbảng, bố cục); parser bóc trường.",
    { width: 340, size: 17, rotate: 1.5 });
  s.note(800, 548,
    "Tốc độ OCR mỗi trang\nGPU RTX 3060+: ~15–25 giây\nCPU: ~90–120 giây (1 luồng)",
    { width: 280, size: 17, rotate: -1.5 });

  // ── step 5: save + review ───────────────────────────────────────────────
  const f5 = s.frame(1060, 700, 480, 374, { label: "Lưu & rà soát", tone: "blue" });
  s.badge(f5.x, f5.y, 5, { tone: "blue" });
  const db = s.cylinder(1345, 775, 180, 220, {
    label: "documents.db", tone: "blue", sub: "documents\ndocument_versions",
  });
  const ed = s.box(1085, 825, 210, 140, {
    label: "Rà soát & sửa", tone: "olive",
    sub: "OCRResultEditor\nLưu → create_new_version\n(phiên bản +1, nhúng lại)",
  });
  s.arrow([1435, b4.y + b4.h], [1435, db.y], {
    tone: "blue", label: "add_document → phiên bản 1", labelDx: -112, labelDy: -36,
  });
  s.arrow([db.x, 865], [ed.x + ed.w, 865], { tone: "olive" });
  s.arrow([ed.x + ed.w, 925], [db.x, 925], { tone: "olive" });

  // ── steps 6 + 7: background workers and what they write ─────────────────
  const w6 = s.box(690, 710, 260, 150, {
    label: "Cắt đoạn + nhúng", tone: "gold", badge: 6,
    sub: "EmbeddingWorker\nđoạn ~2000 ký tự, chồng 200\nVietnamese_Embedding 1024-d",
  });
  const w7 = s.box(690, 900, 260, 150, {
    label: "Quan hệ pháp lý", tone: "gold", badge: 7,
    sub: "RelationWorker · luật regex\ncăn cứ, thay thế, bãi bỏ,\nsửa đổi (theo số ký hiệu)",
  });
  s.arrow([f5.x, w6.cy], w6.right, { tone: "blue", label: "mỗi lần lưu", labelDy: -16 });
  s.arrow([f5.x, w7.cy], w7.right, { tone: "blue", label: "khi lưu OCR", labelDy: -16 });

  const chunks = s.cylinder(380, 700, 240, 170, {
    label: "document_chunks", tone: "blue",
    sub: "chunks_fts · FTS5\nchunk_vectors · sqlite-vec",
  });
  const graph = s.cylinder(380, 890, 240, 170, {
    label: "doc_relations", tone: "blue",
    sub: "doc_entities\ndoc_validity: còn/hết hiệu lực",
  });
  s.arrow(w6.left, [chunks.x + chunks.w, w6.cy], { tone: "gold" });
  s.arrow(w7.left, [graph.x + graph.w, w7.cy], { tone: "gold" });

  // ── step 8: what the indexed corpus is used for ─────────────────────────
  const f8 = s.frame(50, 700, 260, 374, { label: "Dùng kết quả", tone: "olive" });
  s.badge(f8.x, f8.y, 8, { tone: "olive" });
  const uses = [
    ["Tìm kiếm", "BM25 + vector (RRF)"],
    ["Trợ lý pháp luật", "ChatPanel · RagAgent"],
    ["Thống kê", "Statistics · Analytics"],
    ["Xuất Excel / Word", "export_to_excel · html_to_docx"],
  ];
  uses.forEach(([label, sub], i) => {
    s.box(66, 710 + i * 90, 228, 84, {
      label, sub, tone: "olive", labelSize: 20, subSize: 15, shadow: false,
    });
  });
  s.arrow(chunks.left, [f8.x + f8.w, chunks.cy], { tone: "blue" });
  s.arrow(graph.left, [f8.x + f8.w, graph.cy], { tone: "blue" });
});
</script>
</body>
</html>
