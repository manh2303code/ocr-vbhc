<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="sketch-size" content="1600x1150">
<title>OCR VBHC — Phát hành và cập nhật xuyên air-gap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sketch.css">
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js" integrity="sha384-1NLkwxMO2sOqcq7rQkFBhIAUJtbt8ziLxhVKVgKfFGMEU8pF+GEq5LVogviveup6" crossorigin="anonymous"></script>
<script src="sketch.js"></script>
</head>
<body>
<div id="board"></div>
<script>
Sketch.draw({
  width: 1600, height: 1150,
  title: "Bản vá 5 MB thay vì 23 GB",
  subtitle: "Gói tách thành ba tầng có phiên bản riêng · phát hành trên máy có Internet · kiểm tra và cập nhật trên máy air-gap qua USB",
}, (s) => {
  const T = s.tones;
  const MUTED = "#5C665F";
  const INK = "#17231B";
  let seed = 4100;
  const next = () => ++seed;

  // The kit's own label block sits low in short boxes, so centre it here.
  function lbox(x, y, w, h, o) {
    const a = s.box(x, y, w, h, Object.assign({}, o, { label: null, sub: null, badge: null }));
    const L = o.labelSize || 23, S = o.subSize || 16;
    const lines = o.sub ? String(o.sub).split("\n") : [];
    const block = L + (lines.length ? 6 + lines.length * 1.2 * S : 0);
    const top = y + h / 2 - block / 2 + (o.nudge || 0);
    const left = o.align === "left";
    const tx = left ? x + 18 : x + w / 2;
    const anchor = left ? "start" : "middle";
    s.text(tx, top + 0.8 * L, o.label, { size: L, font: "title", color: T[o.tone || "paper"].ink, anchor });
    if (lines.length) {
      s.text(tx, top + L + 6 + 0.92 * S, o.sub, { size: S, color: MUTED, anchor, lineHeight: 1.2 * S });
    }
    // Step numbers share one colour so they read as a single sequence.
    if (o.badge != null) s.badge(x + 4, y + 4, o.badge, { tone: "gold" });
    return a;
  }

  // ════════════════════════════════════════════════════════════════════
  // A · Ba tầng của gói
  // ════════════════════════════════════════════════════════════════════
  s.frame(50, 200, 320, 874, { label: "A · Ba tầng của gói", tone: "paper", washOpacity: 0.3 });

  const app = lbox(70, 228, 280, 72, {
    label: "app · mã nguồn", tone: "olive",
    sub: "≈ 5,2 MB · đổi 64 lần / 3 tháng",
  });

  const runtime = lbox(70, 312, 280, 188, {
    label: "runtime", tone: "muted", subSize: 16,
    sub: [
      "Python 3.9.13 nhúng + 65 gói",
      "ghim: requirements_portable.lock",
      "danh tính = SHA-256 của lock",
      "(runtime_lock_hash)",
      "6,2 GB · gói nén ≈ 0,88 GiB",
      "đổi 4 lần trong cả dự án",
    ].join("\n"),
  });

  const assets = s.box(70, 512, 280, 288, { label: "assets", tone: "red", align: "top" });
  // A small bar chart of what the asset layer actually weighs.
  const rows = [["gguf/", 11, "11 GB"], ["model_embedding/", 2.2, "2,2 GB"],
                ["model_reranker/", 2.2, "2,2 GB"], ["bin/", 1.1, "1,1 GB"]];
  rows.forEach(([name, gb, shown], i) => {
    const y = 586 + i * 44;
    s.text(92, y, name, { size: 17, color: T.red.ink });
    s.text(328, y, shown, { size: 17, color: T.red.ink, anchor: "end" });
    s.layer("shapes").appendChild(s.rc.rectangle(92, y + 7, Math.max(10, 236 * gb / 11), 11, {
      fill: T.red.stroke, fillStyle: "hachure", hachureGap: 3.5, fillWeight: 1,
      stroke: T.red.stroke, strokeWidth: 1, roughness: 0.9, seed: next(),
    }));
  });
  s.text(210, 772, "≈ 16 GB · gần như không đổi", { size: 17, color: MUTED, anchor: "middle" });

  s.text(210, 836, "độ cao chỉ tượng trưng, không theo tỉ lệ", { size: 15, color: MUTED, anchor: "middle" });

  s.note(66, 880, [
    "Tầng đổi nhiều nhất lại nhẹ nhất.",
    "Tách tầng nên bản vá thường chỉ",
    "vài MB, không phải mang cả",
    "23 GB qua air-gap mỗi lần sửa.",
  ].join("\n"), { width: 288, size: 18, rotate: -1.5 });

  // ════════════════════════════════════════════════════════════════════
  // B · Phía phát hành (có Internet)
  // ════════════════════════════════════════════════════════════════════
  s.frame(400, 200, 460, 874, { label: "B · Phía phát hành — có Internet", tone: "muted", washOpacity: 0.3 });

  const patch = lbox(420, 228, 420, 92, {
    label: "Gói vá app · vài MB", tone: "paper", dashed: true,
    sub: "file app đã đổi + BUILD_MANIFEST.json\n+ SHA256SUMS  (định dạng app_updater đọc)",
  });

  const release = s.box(420, 350, 420, 365, {
    label: "Phát hành: release.yml", tone: "muted", align: "top",
    sub: "đẩy tag v* → windows-latest · đóng app + runtime",
  });
  const chips = [
    ["cổng đĩa: ổ C còn ≥ 16 GiB trống", "gold"],
    ["build_portable.py --profile runtime --slim", "paper"],
    ["tar -czf → …-‹tag›-runtime.tar.gz", "paper"],
    ["release_bundle.split_file → phần ≤ 1900 MiB", "paper"],
    ["SHA256SUMS + BUILD_MANIFEST.json", "blue"],
    ["gh release create → GitHub Release", "paper"],
  ];
  const chipY = (i) => 445 + i * 44;
  s.line([[438, chipY(0) + 16], [438, chipY(chips.length - 1) + 16]], { tone: "muted", width: 1.6 });
  chips.forEach(([label, tone], i) => {
    const y = chipY(i);
    s.box(456, y, 366, 32, { tone, radius: 8, shadow: false, roughness: 0.9, strokeWidth: 1.5 });
    s.layer("shapes").appendChild(s.rc.circle(438, y + 16, 9, {
      fill: T.muted.stroke, fillStyle: "solid", stroke: T.muted.stroke, roughness: 0.6, seed: next(),
    }));
    s.text(470, y + 17, label, { size: 17, color: T[tone].ink, baseline: "middle" });
  });

  const assetBundle = lbox(420, 748, 420, 130, {
    label: "Bộ asset · đóng một lần", tone: "muted", subSize: 16,
    sub: [
      "build_asset_bundle.py pack, trên máy giữ asset",
      "tar không nén → split_file → SHA256SUMS",
      "+ ASSET_MANIFEST.json",
      "(asset không nằm trong Git nên CI không dựng được)",
    ].join("\n"),
  });

  lbox(420, 930, 420, 92, {
    label: "Kiểm thử mỗi push / PR", tone: "muted", subSize: 16,
    sub: "ci.yml · pytest trong Docker Linux (Python 3.9)\ntest cần GGUF hay runtime Windows thì tự bỏ qua",
  });

  // Layers feed the producers.
  s.arrow([350, 264], [420, 264], { tone: "olive" });
  s.arrow([350, 420], [420, 420], { tone: "muted" });
  s.arrow([350, 775], [420, 775], { tone: "red" });

  // ── Everything converges on the USB stick ──────────────────────────
  const BUS = 920;
  s.line([[840, 274], [BUS, 274]], { tone: "blue" });
  s.arrow([BUS, 274], [BUS, 348], { tone: "blue" });
  s.line([[822, chipY(5) + 16], [BUS, chipY(5) + 16]], { tone: "blue" });
  s.line([[840, 812], [BUS, 812], [BUS, chipY(5) + 16]], { tone: "blue" });
  s.arrow([BUS, chipY(5) + 16], [BUS, 397], { tone: "blue" });
  s.layer("shapes").appendChild(s.rc.circle(BUS, chipY(5) + 16, 9, {
    fill: T.blue.stroke, fillStyle: "solid", stroke: T.blue.stroke, roughness: 0.6, seed: next(),
  }));
  s.text(950, 560, "mỗi gói kèm SHA256SUMS + manifest", {
    size: 17, color: T.blue.ink, anchor: "middle", baseline: "middle", rotate: -90,
  });

  // A USB stick, straddling the air-gap boundary.
  (function usb(x, y) {
    const shapes = s.layer("shapes");
    const body = s.rc.path(
      "M " + (x + 10) + " " + y + " H " + (x + 80) + " V " + (y + 44) + " H " + (x + 10) +
      " Q " + x + " " + (y + 44) + " " + x + " " + (y + 34) + " V " + (y + 10) +
      " Q " + x + " " + y + " " + (x + 10) + " " + y + " Z",
      { fill: T.red.fill, fillStyle: "solid", stroke: T.red.stroke, strokeWidth: 2.2, roughness: 1.1, seed: next() });
    shapes.appendChild(body);
    shapes.appendChild(s.rc.rectangle(x + 80, y + 10, 28, 24, {
      fill: "#FFFEFA", fillStyle: "solid", stroke: INK, strokeWidth: 1.8, roughness: 0.9, seed: next(),
    }));
    for (const dy of [14, 24]) {
      shapes.appendChild(s.rc.rectangle(x + 90, y + dy, 7, 5, {
        fill: INK, fillStyle: "solid", stroke: INK, strokeWidth: 1, roughness: 0.4, seed: next(),
      }));
    }
    s.text(x + 43, y + 23, "USB", { size: 19, font: "title", color: T.red.ink, anchor: "middle", baseline: "middle" });
  })(880, 350);

  // ════════════════════════════════════════════════════════════════════
  // C · Máy air-gap
  // ════════════════════════════════════════════════════════════════════
  s.frame(990, 200, 560, 874, { label: "C · Máy air-gap — không mạng, chỉ nhận USB", tone: "red", washOpacity: 0.14 });

  const verify = lbox(1030, 232, 240, 90, {
    label: "Kiểm tra gói", tone: "gold", subSize: 16,
    sub: "verify.bat + verify_plan.py\nđọc BUILD_MANIFEST.json",
  });
  const card = s.box(1290, 222, 240, 110, { tone: "paper", shadow: false, radius: 10 });
  s.text(1306, 242, "mã thoát:", { size: 16, color: MUTED });
  [["0", "gói đầy đủ (HOÀN CHỈNH)", "olive"],
   ["10", "gói runtime hợp lệ", "gold"],
   ["1", "gói hỏng, thiếu file", "red"]].forEach(([code, text, tone], i) => {
    const y = 268 + i * 26;
    s.text(1326, y, code, { size: 20, font: "title", color: T[tone].ink, anchor: "middle", baseline: "middle" });
    s.text(1350, y, text, { size: 17, color: INK, baseline: "middle" });
  });
  s.arrow(verify.right, [1290, verify.cy], { tone: "gold", headSize: 10 });

  // USB → fork: full packages up to verify.bat, patches down to CAP_NHAT.bat.
  s.line([[988, 372], [1060, 372]], { tone: "red", width: 2.2 });
  s.arrow([1060, 372], [1060, 325], { tone: "red" });
  s.arrow([1060, 372], [1060, 408], { tone: "red" });
  s.text(1078, 354, "gói runtime · bộ asset → kiểm, ghép phần, giải nén", { size: 16, color: T.red.ink, baseline: "middle" });
  s.text(1078, 391, "gói vá app", { size: 16, color: T.red.ink, baseline: "middle" });

  const capNhat = lbox(1030, 410, 240, 60, {
    label: "Áp bản vá", tone: "olive", subSize: 16, sub: "CAP_NHAT.bat ‹thư mục vá›",
  });
  // On success CAP_NHAT.bat tells the operator to run verify.bat again.
  s.text(1290, 428, "thành công → chạy lại\nverify.bat kiểm lại gói", { size: 16, color: T.olive.ink, lineHeight: 19 });
  s.arrow([1490, 452], [1490, 336], { tone: "olive", dashed: true, headSize: 11 });

  // ── app_updater.apply_patch ─────────────────────────────────────────
  s.frame(1012, 498, 522, 552, { tone: "gold", washOpacity: 0.18 });
  s.text(1520, 488, "app_updater.apply_patch", { size: 21, font: "title", color: T.gold.ink, anchor: "end" });

  const SX = 1035, SW = 270, MID = 1170;
  const s1 = lbox(SX, 518, SW, 56, {
    label: "Kiểm SHA256SUMS", tone: "blue", badge: 1, labelSize: 22,
    sub: "release_bundle.verify_checksums",
  });
  const s2 = lbox(SX, 598, SW, 114, {
    label: "Kiểm tương thích", tone: "gold", badge: 2, labelSize: 22, subSize: 15,
    sub: [
      "compatibility_problems:",
      "đúng runtime · đủ asset",
      "không hạ cấp · version xếp hạng được",
      "+ không ghi vào PROTECTED_DIRS",
    ].join("\n"),
  });
  const s3 = lbox(SX, 736, SW, 56, {
    label: "Sao lưu tầng app", tone: "paper", badge: 3, labelSize: 22,
    sub: "→ backup/app-‹ngày-giờ›",
  });
  const s4 = lbox(SX, 816, SW, 56, {
    label: "Chép đè file vá", tone: "paper", badge: 4, labelSize: 22,
    sub: "chỉ những file gói vá mang theo",
  });
  const s6 = lbox(SX, 896, SW, 56, {
    label: "Ghi manifest mới", tone: "blue", badge: 6, labelSize: 22,
    sub: "BUILD_MANIFEST.json · layers.app",
  });

  s.arrow([capNhat.cx, capNhat.y + capNhat.h], [capNhat.cx, s1.y - 2]);
  s.arrow([MID, s1.y + s1.h], [MID, s2.y - 2]);
  s.arrow([MID, s2.y + s2.h], [MID, s3.y - 2]);
  s.arrow([MID, s3.y + s3.h], [MID, s4.y - 2]);
  s.arrow([MID, s4.y + s4.h], [MID, s6.y - 2]);

  const reject = lbox(1350, 535, 170, 135, {
    label: "Từ chối", tone: "gold", dashed: true, subSize: 15,
    sub: "báo MỌI lỗi một lần\nkhông ghi gì cả\nmáy giữ nguyên",
  });
  s.arrow([SX + SW, 546], [1350, 562], { tone: "gold" });
  s.arrow([SX + SW, 648], [1350, 640], { tone: "gold" });

  const rollback = lbox(1350, 814, 170, 60, {
    label: "Khôi phục", tone: "gold", badge: 5, subSize: 15,
    sub: "khi lỗi giữa chừng",
  });
  s.arrow([SX + SW, 844], [1350, 844], { tone: "gold" });
  s.line([[SX + SW, 764], [1435, 764]], { tone: "gold", dashed: true });
  s.arrow([1435, 764], [1435, 812], { tone: "gold", dashed: true });
  s.text(1330, 752, "chép lại từ bản sao", { size: 15, color: T.gold.ink });

  // ── Operator-owned data, guarded by PROTECTED_DIRS ──────────────────
  lbox(1035, 974, 485, 58, {
    label: "Không bao giờ chạm", tone: "blue", align: "left", labelSize: 20, subSize: 15,
    sub: "PROTECTED_DIRS: database/ config/ logs/ output/ temp/ backup/",
  });
  (function padlock(x, y) {
    const t = T.red;
    s.layer("text").appendChild(s.rc.path(
      "M " + (x + 4) + " " + y + " V " + (y - 7) + " A 7 7 0 0 1 " + (x + 18) + " " + (y - 7) + " V " + y,
      { stroke: t.stroke, strokeWidth: 2.2, roughness: 0.7, seed: next() }));
    s.layer("text").appendChild(s.rc.rectangle(x, y, 22, 17, {
      fill: t.fill, fillStyle: "solid", stroke: t.stroke, strokeWidth: 2, roughness: 0.8, seed: next(),
    }));
  })(1484, 990);
});
</script>
</body>
</html>
