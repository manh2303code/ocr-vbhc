# The hash of this file is the runtime layer identity; see
# build_portable.runtime_lock_hash. An application patch records the hash it
# was built against so the target-side updater can refuse a patch meant for a
# runtime that is not installed.
#
# Generated by resolving requirements_portable.txt plus torch==TORCH_VERSION
# against the CPU index, NOT by pip freeze. A freeze of the development tree
# also captured timm, ultralytics and torchvision, left over from the
# YOLO/Vintern pipeline retired on 2026-04-17 and imported by nothing.
#
# Regenerate:
#   pip install --dry-run --ignore-installed --only-binary=:all: \n#       --extra-index-url https://download.pytorch.org/whl/cpu \n#       --report resolve.json torch==2.8.0 -r requirements_portable.txt
#
# Local version segments (+cpu, +cu118) are stripped: they pin to one index.
# torch 2.8.0 is required for Blackwell sm_120; the tree this was generated on
# still carried 2.1.2+cu118, which is why AI search runs on CPU there.
